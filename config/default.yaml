# Distributed Reasoning Loop Configuration

data_generator:
  teacher_model: "Qwen/Qwen2.5-7B-Instruct"
  student_model: "Qwen/Qwen2.5-7B-Instruct"
  backend: "vllm"
  tensor_parallel_size: "auto"
  gpu_memory_utilization: 0.9
  num_cot_paths: 10
  max_new_tokens: 2048
  temperature: 0.8
  top_p: 0.95

  datasets:
    math: "gsm8k"
    code: "humaneval"

  verification:
    code_timeout: 10
    math_timeout: 10

  preprocessing:
    min_reasoning_tokens: 50
    max_reasoning_tokens: 2048
    min_response_length: 100
    max_response_length: 8000
    min_step_count: 2
    require_final_answer: true
    filter_repetitive: true
    max_repetition_ratio: 0.3
    dedup_threshold: 0.85
    min_pair_diversity: 0.2
    max_pairs_per_problem: 5
    prefer_high_confidence: true
    require_answer_disagreement_for_pairs: true
    prioritize_step_aligned_pairs: true
    max_pairs_per_error_type: 2

verifier:
  type: "math"  # math or code
  math:
    timeout: 10
  code:
    timeout: 10
    docker_image: "distributed-reasoning-loop-sandbox:latest"
    memory_limit: "512m"
    max_workers: 8

orchestration:
  kafka:
    enabled: false
    bootstrap_servers: ["localhost:9092"]
    topics:
      raw_reasoning_data: "raw_reasoning_data"
      verified_paths: "verified_paths"
      training_data: "training_data"

  ray:
    num_workers: 4
    object_store_memory: "4GB"

  kv_cache:
    max_cache_size: "16GB"
    eviction_policy: "lru"

training:
  method: "best"
  problem_type: "math"
  batch_size: 2
  learning_rate: 1e-6
  num_epochs: 1

  dpo:
    beta: 0.1
    max_length: 2048
    max_prompt_length: 512

  grpo:
    group_size: 8
    kl_threshold: 0.1
    eval_interval_steps: 50
    heldout_eval_size: 20
    heldout_dataset: "gsm8k"
    eval_max_new_tokens: 256
    save_best_checkpoint: true
    best_checkpoint_metric: "pass_at_1"
    min_eval_improvement: 0.0001
    early_stop_patience: 3
    online_max_new_tokens: 256
    online_temperature: 0.8
    online_top_p: 0.95
    online_resample_attempts: 2
    online_min_reward_std: 1e-6
    enable_ray_verification: true
    ray_verifier_workers: 4

  reward_model:
    model_name: "Qwen/Qwen2.5-0.5B-Instruct"
    output_dir: "./outputs/reward_model"

  process_reward_model:
    model_name: "Qwen/Qwen2.5-0.5B-Instruct"
    output_dir: "./outputs/process_reward_model"
    step_labels_path: "./synthetic_data/step_labels.jsonl"

  evaluation:
    num_paths: 16
    oracle_verify: false
    reward_model: "./outputs/reward_model"
    process_reward_model: "./outputs/process_reward_model"

  wandb:
    enabled: true
    project: "distributed-reasoning-loop"
    mode: "offline"

speculative_decoding:
  draft_model: "Qwen/Qwen2.5-1.5B-Instruct"
  target_model: "Qwen/Qwen2.5-7B-Instruct"
  max_speculative_tokens: 5

general:
  seed: 42
  log_level: "INFO"
  output_dir: "./outputs"
  cache_dir: "./cache"
